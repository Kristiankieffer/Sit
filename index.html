<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sit">
<meta name="theme-color" content="#E8E8E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Meditation timer</title>
<style>
:root{
  --bg:#E8E8E8; --ink:#222222; --muted:#6B6B6B; --accent:#3A3A3A; --soft:#A0A0A0; --track:#CFCFCF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1C; --ink:#E6E6E6; --muted:#9A9A9A; --accent:#D6D6D6; --soft:#707070; --track:#363636;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --ink:#E6E6E6; --muted:#9A9A9A; --accent:#D6D6D6; --soft:#707070; --track:#363636;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh; min-height:100svh; display:grid; place-items:center;
  padding:calc(32px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px)); -webkit-font-smoothing:antialiased;
}
main{width:100%; max-width:400px; text-align:center}
h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif; font-weight:500; font-size:1.2rem;
  letter-spacing:.02em; margin:0 0 36px; color:var(--muted);
}

/* time fields with scroll wheels */
.field{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 4px; border-bottom:1px solid var(--track);
}
.field.first{border-top:1px solid var(--track)}
.label{font-size:1rem; text-align:left}
.wheels{display:flex; align-items:center; gap:6px}
.unit{color:var(--muted); font-size:.85rem; width:2.2em; text-align:left}
.wheel-box{position:relative; width:64px; height:120px}
.wheel-box::before{
  content:""; position:absolute; left:4px; right:4px; top:40px; height:40px;
  border-top:1px solid var(--track); border-bottom:1px solid var(--track); pointer-events:none;
}
.wheel{
  height:120px; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent, #000 38%, #000 62%, transparent);
          mask-image:linear-gradient(transparent, #000 38%, #000 62%, transparent);
  overscroll-behavior:contain; border-radius:6px;
}
.wheel::-webkit-scrollbar{display:none}
.wheel .spacer{height:40px}
.wheel .item{
  height:40px; line-height:40px; scroll-snap-align:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif; font-size:1.45rem;
  font-variant-numeric:tabular-nums; color:var(--muted); cursor:pointer; user-select:none; -webkit-user-select:none;
}
.wheel .item.sel{color:var(--ink)}

.summary{color:var(--muted); font-size:.95rem; line-height:1.65; margin:26px 0; min-height:3.3em}
.primary{
  appearance:none; border:0; background:var(--accent); color:var(--bg); font:inherit;
  font-size:1.05rem; padding:14px 48px; border-radius:999px; cursor:pointer; min-width:10em;
}
.primary:disabled{opacity:.35; cursor:default}
.quiet{
  appearance:none; background:transparent; border:1px solid var(--track); color:var(--muted);
  font:inherit; font-size:.95rem; padding:10px 26px; border-radius:999px; cursor:pointer; min-width:11em;
}
.controls{display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:36px}

details{margin-top:44px; color:var(--muted); text-align:left}
summary{cursor:pointer; text-align:center; font-size:.9rem; list-style:none; padding:8px}
summary::-webkit-details-marker{display:none}
.bset{padding:14px 4px; border-bottom:1px solid var(--track)}
.bset:first-of-type{border-top:1px solid var(--track); margin-top:12px}
.bhead{display:flex; justify-content:space-between; align-items:center; color:var(--ink); margin-bottom:8px}
.play{
  appearance:none; background:transparent; border:1px solid var(--track); color:var(--ink);
  font:inherit; font-size:.85rem; padding:6px 16px; border-radius:999px; cursor:pointer;
}
.bset label{display:block; font-size:.85rem}
.bset label + label{margin-top:10px}
.bset .val{float:right; font-variant-numeric:tabular-nums}
.check{display:flex !important; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer}
.check input{accent-color:var(--accent); width:16px; height:16px; margin:0}
.dim{opacity:.4}
input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 0}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* session */
.ring-wrap{position:relative; width:min(78vw,320px); aspect-ratio:1; margin:0 auto}
.ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg); display:block}
.track{fill:none; stroke:var(--track); stroke-width:3}
.prog{
  fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round;
  transition:stroke-dashoffset .25s linear, stroke .8s ease;
}
.is-warm .prog{stroke:var(--soft)}
.center{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
}
#phase{color:var(--muted); font-size:.95rem}
#time{
  font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif; font-weight:400;
  font-size:clamp(2.8rem,14vw,4rem); font-variant-numeric:tabular-nums; line-height:1.1;
}
.is-paused #time{opacity:.5}
@media (prefers-reduced-motion: reduce){ .prog{transition:none} }
[hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <h1>Meditation timer</h1>

  <section id="setup">
    <div class="field first">
      <span class="label">Warm-up</span>
      <div class="wheels">
        <div class="wheel-box"><div class="wheel" id="warmMin" tabindex="0" role="spinbutton" aria-label="Warm-up minutes"></div></div>
        <span class="unit">min</span>
        <div class="wheel-box"><div class="wheel" id="warmSec" tabindex="0" role="spinbutton" aria-label="Warm-up seconds"></div></div>
        <span class="unit">sec</span>
      </div>
    </div>
    <div class="field">
      <span class="label">Sitting</span>
      <div class="wheels">
        <div class="wheel-box"><div class="wheel" id="sitMin" tabindex="0" role="spinbutton" aria-label="Sitting minutes"></div></div>
        <span class="unit">min</span>
        <div class="wheel-box"><div class="wheel" id="sitSec" tabindex="0" role="spinbutton" aria-label="Sitting seconds"></div></div>
        <span class="unit">sec</span>
      </div>
    </div>

    <p class="summary" id="summary"></p>
    <button type="button" class="primary" id="startBtn">Begin</button>

    <details>
      <summary>Bell sound</summary>
      <div class="bset">
        <div class="bhead"><span>Starting bell</span><button type="button" class="play" data-play="start">Play</button></div>
        <label>Pitch <span class="val" id="startPitchVal"></span>
          <input type="range" id="startPitch" min="600" max="1400" step="10"></label>
      </div>
      <div class="bset">
        <div class="bhead"><span>Ending bell</span><button type="button" class="play" data-play="end">Play</button></div>
        <label class="check"><input type="checkbox" id="endSame"> Same as starting bell</label>
        <label id="endPitchLabel">Pitch <span class="val" id="endPitchVal"></span>
          <input type="range" id="endPitch" min="600" max="1400" step="10"></label>
      </div>
      <div class="bset">
        <label>Ring length <span class="val" id="ringVal"></span>
          <input type="range" id="ring" min="5" max="25" step="1"></label>
        <label>Volume <span class="val" id="volVal"></span>
          <input type="range" id="vol" min="0" max="1" step="0.05"></label>
      </div>
    </details>
  </section>

  <section id="session" hidden>
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 320 320" aria-hidden="true">
        <circle class="track" cx="160" cy="160" r="150"/>
        <circle class="prog" id="prog" cx="160" cy="160" r="150"/>
      </svg>
      <div class="center">
        <div id="phase">Warming up</div>
        <div id="time" role="timer">0:00</div>
      </div>
    </div>
    <div class="controls">
      <button type="button" class="primary" id="pauseBtn">Pause</button>
      <button type="button" class="quiet" id="stopBtn">End session</button>
    </div>
  </section>
</main>

<script>
(function(){
  const KEY = 'meditation-timer-settings';
  let settings = { warmSec:30, sitSec:1200, startPitch:1050, endPitch:880, endSame:false, ring:12, vol:0.7 };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object'){
      if (saved.sitSec == null && typeof saved.sit === 'number') saved.sitSec = saved.sit * 60;
      if (saved.warmSec == null && typeof saved.warm === 'number') saved.warmSec = saved.warm;
      delete saved.sit; delete saved.warm;
      settings = Object.assign(settings, saved);
    }
  } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch(e) {} }

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fmtClock = s => { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60), r = s%60; return m + ':' + String(r).padStart(2,'0'); };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function fmtDur(s){
    const m = Math.floor(s/60), r = s%60;
    if (m && r) return plural(m,'minute') + ' ' + plural(r,'second');
    if (m) return plural(m,'minute');
    return plural(r,'second');
  }
  const endPitch = () => settings.endSame ? settings.startPitch : settings.endPitch;

  // ---------- Scroll wheels ----------
  const ITEM = 40;
  function makeWheel(el, max, pad, onChange){
    const frag = document.createDocumentFragment();
    const top = document.createElement('div'); top.className = 'spacer'; frag.appendChild(top);
    const items = [];
    for (let i = 0; i <= max; i++){
      const d = document.createElement('div');
      d.className = 'item'; d.textContent = pad ? String(i).padStart(2,'0') : String(i);
      d.addEventListener('click', () => set(i, true));
      items.push(d); frag.appendChild(d);
    }
    const bot = document.createElement('div'); bot.className = 'spacer'; frag.appendChild(bot);
    el.appendChild(frag);
    el.setAttribute('aria-valuemin', 0); el.setAttribute('aria-valuemax', max);

    let val = -1;
    function mark(v){
      if (val >= 0 && items[val]) items[val].classList.remove('sel');
      val = v; items[v].classList.add('sel');
      el.setAttribute('aria-valuenow', v);
    }
    el.addEventListener('scroll', () => {
      const i = clamp(Math.round(el.scrollTop / ITEM), 0, max);
      if (i !== val){ mark(i); onChange(); }
    }, {passive:true});
    el.addEventListener('keydown', e => {
      let d = 0;
      if (e.key === 'ArrowUp') d = -1; else if (e.key === 'ArrowDown') d = 1;
      else if (e.key === 'PageUp') d = -10; else if (e.key === 'PageDown') d = 10;
      if (d){ e.preventDefault(); set(clamp(val + d, 0, max), false); }
    });
    function set(v, smooth){
      v = clamp(v, 0, max);
      if (v !== val){ mark(v); onChange(); }
      el.scrollTo({ top: v * ITEM, behavior: smooth ? 'smooth' : 'auto' });
    }
    return { set, get: () => Math.max(0, val), silentSet(v){ v = clamp(v,0,max); mark(v); el.scrollTop = v * ITEM; } };
  }

  const onWheel = () => {
    settings.warmSec = wWarmMin.get()*60 + wWarmSec.get();
    settings.sitSec  = wSitMin.get()*60 + wSitSec.get();
    save(); renderSummary();
  };
  const wWarmMin = makeWheel($('warmMin'), 59, false, onWheel);
  const wWarmSec = makeWheel($('warmSec'), 59, true,  onWheel);
  const wSitMin  = makeWheel($('sitMin'), 180, false, onWheel);
  const wSitSec  = makeWheel($('sitSec'), 59, true,  onWheel);

  function syncWheels(){
    const w = clamp(settings.warmSec, 0, 59*60+59), s = clamp(settings.sitSec, 0, 180*60+59);
    wWarmMin.silentSet(Math.floor(w/60)); wWarmSec.silentSet(w%60);
    wSitMin.silentSet(Math.floor(s/60));  wSitSec.silentSet(s%60);
  }

  function renderSummary(){
    const ok = settings.sitSec > 0;
    $('startBtn').disabled = !ok;
    if (!ok){ $('summary').textContent = 'Set a sitting time to begin.'; return; }
    $('summary').textContent = settings.warmSec > 0
      ? 'A ' + fmtDur(settings.warmSec) + ' warm-up, then the starting bell and ' + fmtDur(settings.sitSec) + ' of sitting.'
      : 'The starting bell rings right away, then ' + fmtDur(settings.sitSec) + ' of sitting.';
  }

  function renderBells(){
    $('startPitch').value = settings.startPitch; $('startPitchVal').textContent = settings.startPitch + ' Hz';
    $('endSame').checked = !!settings.endSame;
    $('endPitch').value = endPitch(); $('endPitchVal').textContent = endPitch() + ' Hz';
    $('endPitch').disabled = !!settings.endSame;
    $('endPitchLabel').classList.toggle('dim', !!settings.endSame);
    $('ring').value = settings.ring; $('ringVal').textContent = settings.ring + ' s';
    $('vol').value = settings.vol;   $('volVal').textContent = Math.round(settings.vol*100) + '%';
  }

  ['startPitch','endPitch','ring','vol'].forEach(id => {
    $(id).addEventListener('input', e => {
      settings[id] = parseFloat(e.target.value);
      if (id === 'vol' && master) master.gain.setTargetAtTime(settings.vol, ctx.currentTime, 0.02);
      save(); renderBells();
    });
  });
  $('endSame').addEventListener('change', e => { settings.endSame = e.target.checked; save(); renderBells(); });

  // ---------- Bell synthesis ----------
  let ctx = null, master = null, verbIn = null, previewBus = null;

  function makeImpulse(seconds){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
    }
    return buf;
  }
  function ensureAudio(){
    if (!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = settings.vol;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
      master.connect(lp); lp.connect(ctx.destination);
      const conv = ctx.createConvolver(); conv.buffer = makeImpulse(3.2);
      const wet = ctx.createGain(); wet.gain.value = 0.22;
      verbIn = ctx.createGain(); verbIn.connect(conv); conv.connect(wet); wet.connect(master);
      previewBus = newBus();
    }
    if (ctx.state !== 'running') ctx.resume();
  }
  function newBus(){ const b = ctx.createGain(); b.connect(master); b.connect(verbIn); return b; }
  function cancelBus(b){
    if (!b) return;
    b.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
    setTimeout(() => { try { b.disconnect(); } catch(e) {} }, 300);
  }

  function strike(bus, when, freq, ringSec){
    const partials = [
      [1.00, 1.00, 1.00, 1.3],
      [2.71, 0.42, 0.55, 2.2],
      [5.15, 0.20, 0.32, 3.1],
      [8.50, 0.07, 0.16, 0  ]
    ];
    partials.forEach(([r, a, d, beat]) => {
      const dur = Math.max(0.5, ringSec * d);
      const freqs = beat ? [freq*r, freq*r + beat] : [freq*r];
      freqs.forEach(f => {
        if (f > ctx.sampleRate/2 - 500) return;
        const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
        const g = ctx.createGain();
        const peak = a * 0.32 / freqs.length;
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        osc.connect(g); g.connect(bus);
        osc.start(when); osc.stop(when + dur + 0.05);
      });
    });
    const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.05), ctx.sampleRate);
    const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = nb;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(freq*4, 8000); bp.Q.value = 1;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.03, when); ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.04);
    src.connect(bp); bp.connect(ng); ng.connect(bus);
    src.start(when); src.stop(when + 0.06);
  }

  document.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => {
    ensureAudio();
    const f = b.dataset.play === 'start' ? settings.startPitch : endPitch();
    strike(previewBus, ctx.currentTime + 0.05, f, settings.ring);
  }));

  // ---------- Session ----------
  let sess = null, timer = null, wakeLock = null, confirmTimer = null;
  const prog = $('prog');
  const C = 2 * Math.PI * 150;
  prog.style.strokeDasharray = C;
  const setRing = p => { prog.style.strokeDashoffset = C * (1 - clamp(p, 0, 1)); };

  async function requestWakeLock(){
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  function releaseWakeLock(){ try { wakeLock && wakeLock.release(); } catch(e) {} wakeLock = null; }

  // Schedule bells from "now" given the time left in each phase.
  function schedule(warmRem, sitRem){
    const t = ctx.currentTime + 0.12;
    sess.warmEnd = t + warmRem;
    sess.sitEnd = sess.warmEnd + sitRem;
    sess.startBus = null;
    if (sess.startPending){
      sess.startBus = newBus();
      strike(sess.startBus, sess.warmEnd, settings.startPitch, settings.ring);
    }
    sess.endBus = newBus();
    strike(sess.endBus, sess.sitEnd, endPitch(), settings.ring);
  }

  function begin(){
    if (settings.sitSec <= 0) return;
    ensureAudio();
    sess = { warm: settings.warmSec, sit: settings.sitSec, startPending: true, paused: false, done: false };
    schedule(sess.warm, sess.sit);
    $('setup').hidden = true; $('session').hidden = false;
    $('pauseBtn').hidden = false; $('pauseBtn').textContent = 'Pause';
    $('stopBtn').textContent = 'End session'; $('stopBtn').dataset.confirm = '';
    $('ringWrap').classList.remove('is-paused');
    requestWakeLock();
    clearInterval(timer); timer = setInterval(tick, 200); tick();
  }

  function remaining(now){
    const warmRem = Math.max(0, sess.warmEnd - now);
    const sitRem = Math.min(sess.sit, sess.sitEnd - Math.max(now, sess.warmEnd));
    return { warmRem, sitRem };
  }

  function draw(now){
    const { warmRem, sitRem } = remaining(now);
    const wrap = $('ringWrap');
    const inWarm = warmRem > 0 && sess.warm > 0;
    const label = sess.paused ? 'Paused' : (inWarm ? 'Warming up' : 'Sitting');
    wrap.classList.toggle('is-warm', inWarm);
    $('phase').textContent = label;
    const shown = inWarm ? warmRem : sitRem;
    $('time').textContent = fmtClock(shown);
    setRing(inWarm ? 1 - warmRem / sess.warm : 1 - sitRem / sess.sit);
    document.title = fmtClock(shown) + ' · ' + label;
  }

  function tick(){
    if (!sess || sess.paused || sess.done) return;
    const now = ctx.currentTime;
    if (sess.startPending && now >= sess.warmEnd) sess.startPending = false;
    if (now >= sess.sitEnd){ finish(); return; }
    draw(now);
  }

  function pause(){
    const now = ctx.currentTime;
    if (now >= sess.sitEnd) return;
    if (sess.startPending && now < sess.warmEnd) cancelBus(sess.startBus);
    else sess.startPending = false;          // a bell that already rang keeps ringing out
    cancelBus(sess.endBus);
    const r = remaining(now);
    sess.warmRem = r.warmRem; sess.sitRem = r.sitRem;
    sess.paused = true;
    clearInterval(timer);
    draw(now);
    $('ringWrap').classList.add('is-paused');
    $('pauseBtn').textContent = 'Resume';
    releaseWakeLock();
  }

  function resume(){
    ensureAudio();
    sess.paused = false;
    schedule(sess.warmRem, sess.sitRem);
    $('ringWrap').classList.remove('is-paused');
    $('pauseBtn').textContent = 'Pause';
    requestWakeLock();
    clearInterval(timer); timer = setInterval(tick, 200); tick();
  }

  function finish(){
    clearInterval(timer);
    sess.done = true;
    $('ringWrap').classList.remove('is-warm','is-paused');
    $('phase').textContent = 'Complete';
    $('time').textContent = fmtClock(sess.sit);
    setRing(1);
    $('pauseBtn').hidden = true;
    $('stopBtn').textContent = 'Done';
    document.title = 'Meditation timer';
    releaseWakeLock();
  }

  function backToSetup(){
    clearInterval(timer); clearTimeout(confirmTimer);
    sess = null;
    $('session').hidden = true; $('setup').hidden = false;
    setRing(0);
    syncWheels();
    document.title = 'Meditation timer';
    releaseWakeLock();
  }

  $('pauseBtn').addEventListener('click', () => {
    if (!sess || sess.done) return;
    sess.paused ? resume() : pause();
  });

  $('stopBtn').addEventListener('click', () => {
    if (!sess) return;
    if (sess.done){ backToSetup(); return; }   // let the ending bell ring out
    const btn = $('stopBtn');
    if (btn.dataset.confirm !== '1'){
      btn.dataset.confirm = '1'; btn.textContent = 'Tap again to end';
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(() => { btn.dataset.confirm = ''; if (sess && !sess.done) btn.textContent = 'End session'; }, 3000);
      return;
    }
    btn.dataset.confirm = '';
    if (sess.startPending) cancelBus(sess.startBus);
    cancelBus(sess.endBus);
    backToSetup();
  });

  $('startBtn').addEventListener('click', begin);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sess && !sess.done && !sess.paused){
      if (ctx && ctx.state !== 'running') ctx.resume();
      wakeLock = null; requestWakeLock();
      tick();
    }
  });

  setRing(0);
  syncWheels();
  renderSummary();
  renderBells();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
